name: Publish

# Publishes to GitHub Packages when the version in package.json isn't there yet, so a release is a version bump
# merged to main. Every other push to main only runs the checks.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish

jobs:
  publish:
    name: Check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: navikt/navno-actions/setup-node-pnpm@v1
        with:
          reader-token: ${{ secrets.READER_TOKEN }}

      - run: pnpm run lint

      - run: pnpm test

      - run: pnpm run build

      - name: Publish, unless this version is already out
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@navikt/navno-logger@$version" version > /dev/null 2>&1; then
            echo "$version is already published"
          else
            pnpm publish --no-git-checks
          fi
